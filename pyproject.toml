[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halyk-epay"
version = "0.1.0"
description = "Async Python SDK for Halyk Bank ePay (Kazakhstan) — hosted page, cryptogram, webhooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Medet Zhumakhan", email = "zhumakhanmedet@gmail.com" }]
keywords = ["halyk", "epay", "kazakhstan", "payment", "fintech", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.6,<3.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage      = "https://github.com/Medeeet/halyk-epay"
Repository    = "https://github.com/Medeeet/halyk-epay"
Issues        = "https://github.com/Medeeet/halyk-epay/issues"
Documentation = "https://github.com/Medeeet/halyk-epay#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/halyk_epay"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
